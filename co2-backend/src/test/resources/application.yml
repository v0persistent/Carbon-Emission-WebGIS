spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: none

jwt:
  secret: test-secret-key-for-unit-tests
  expiration-ms: 3600000
  issuer: co2-emission-webgis-test
