server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/co2_emission
    username: co2app
    password: co2pass123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: none

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

jwt:
  secret: ${JWT_SECRET:co2-emission-webgis-jwt-secret-key-2026}
  expiration-ms: 86400000
  issuer: co2-emission-webgis
